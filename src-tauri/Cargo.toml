[package]
name = "rotoras-generator"
version = "0.22.0"
description = "Lokale Rotoras Generator voor Autodesk Inventor"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
